<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #F5F9FD;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="45"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-question"
        class="scene"
        data-composition-id="01-question"
        data-composition-src="compositions/frames/01-question.html"
        data-start="0"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-intro"
        class="scene"
        data-composition-id="02-intro"
        data-composition-src="compositions/frames/02-intro.html"
        data-start="5"
        data-duration="6.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-delivery"
        class="scene"
        data-composition-id="03-delivery"
        data-composition-src="compositions/frames/03-delivery.html"
        data-start="11"
        data-duration="7.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-discount"
        class="scene"
        data-composition-id="04-discount"
        data-composition-src="compositions/frames/04-discount.html"
        data-start="18"
        data-duration="7.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-tamara"
        class="scene"
        data-composition-id="05-tamara"
        data-composition-src="compositions/frames/05-tamara.html"
        data-start="25"
        data-duration="7.5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-recap"
        class="scene"
        data-composition-id="06-recap"
        data-composition-src="compositions/frames/06-recap.html"
        data-start="32"
        data-duration="6.5"
        data-track-index="1"
      ></div>

      <div
        id="el-07-cta"
        class="scene"
        data-composition-id="07-cta"
        data-composition-src="compositions/frames/07-cta.html"
        data-start="38"
        data-duration="7"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-question", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 5);
        tl.fromTo("#el-02-intro", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 5);
        tl.to("#el-02-intro", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 11);
        tl.fromTo("#el-03-delivery", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 11);
        tl.to("#el-03-delivery", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 18);
        tl.fromTo("#el-04-discount", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 18);
        tl.to("#el-04-discount", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 25);
        tl.fromTo("#el-05-tamara", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 25);
        tl.to("#el-05-tamara", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 32);
        tl.fromTo("#el-06-recap", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 32);
        tl.to("#el-06-recap", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 38);
        tl.fromTo("#el-07-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 38);
        tl.to({}, { duration: 45 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
